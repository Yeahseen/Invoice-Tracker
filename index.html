            }
        };

        // --- DIRECT-TO-BILLING INVOICES (e.g. compliance) ---
        const DIRECT_CATEGORIES = ['Compliance', 'Consultancy Services', 'Other'];
        function knownCategories() {
            const used = window.appState.invoices.map(i => i.category).filter(Boolean);
            return [...new Set([...DIRECT_CATEGORIES, ...used])];
        }
        function kindOf(inv) { return inv.type === 'direct' ? 'direct:' + (inv.category || '') : 'standard'; }
        function kindOptions(list) {
            const opts = [];
            if (list.some(i => i.type !== 'direct')) opts.push({ value: 'standard', label: 'Standard (via Main Store)' });
            const direct = list.filter(i => i.type === 'direct');
            if (direct.length) {
                opts.push({ value: 'direct', label: 'All direct-to-Billing' });
                [...new Set(direct.map(i => i.category || ''))].sort().forEach(c => opts.push({ value: 'direct:' + c, label: 'Direct - ' + (c || 'no category') }));
            }
            return opts;
        }
        function matchesKind(inv, kind) {
            if (!kind) return true;
            if (kind === 'direct') return inv.type === 'direct';
            return kindOf(inv) === kind;
        }
        function typeTag(inv) {
            if (inv.type !== 'direct') return '';
            return `<div class="mt-1"><span class="inline-flex px-2 py-0.5 rounded-md text-[10px] font-semibold border bg-sky-50 text-sky-700 border-sky-200">Direct${inv.category ? ' - ' + escapeHtml(inv.category) : ''}</span></div>`;
        }

        // --- PAYMENT HELPERS (Filing / Vivian) ---
        const round2 = (x) => Math.round((Number(x) + Number.EPSILON) * 100) / 100;
        function invCurrency(inv) {
            if (inv.currency) return inv.currency;
            const m = String(inv.amount || '').match(/\b[A-Z]{3}\b/);
            return m ? m[0] : 'KES';
        }
        function invTotal(inv) { return inv.amountValue != null ? inv.amountValue : normAmount(inv.amount); }
        function activePayments(inv) { return (inv.payments || []).filter(p => !p.reversed); }
        function paidSoFar(inv) { return round2(activePayments(inv).reduce((a, p) => a + (Number(p.amount) || 0), 0)); }
        function balanceOf(inv) {
            const t = invTotal(inv);
            return t == null ? null : round2(Math.max(0, t - paidSoFar(inv)));
        }
        // 'confirm' | 'unpaid' | 'part' | 'paid' | '' (not at Filing yet)
        function payState(inv) {
            if (inv.currentStage === STAGES.COMPLETED) return 'paid';
            if (inv.currentStage !== STAGES.FILING) return '';
            if (inv.filingStatus !== 'confirmed') return 'confirm';
            return paidSoFar(inv) > 0 ? 'part' : 'unpaid';
        }
        function canHandlePayments() {
            const r = window.appState.currentUser && window.appState.currentUser.role;
            return r === 'Filing' || r === 'Admin';
        }
        function payBadge(inv) {
            const st = payState(inv);
            if (!st || st === 'paid') return '';
            const bal = balanceOf(inv);
            const map = {
                confirm: ['bg-indigo-50 text-indigo-700 border-indigo-200', 'Awaiting confirmation'],
                unpaid: ['bg-rose-50 text-rose-700 border-rose-200', 'Unpaid'],
                part: ['bg-amber-50 text-amber-700 border-amber-200', 'Part-paid' + (bal != null ? ' - balance ' + formatMoney(bal, invCurrency(inv)) : '')]
            };
            const [cls, label] = map[st];
            return `<div class="mt-1.5"><span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold border ${cls}">${escapeHtml(label)}</span></div>`;
        }
        function paymentExportCells(i) {
            const st = payState(i);
            const label = { confirm: 'Awaiting confirmation', unpaid: 'Unpaid', part: 'Part-paid', paid: 'Paid' }[st] || '';
            if (!st) return ['', '', '', '', ''];
            const act = activePayments(i);
            const last = act.length ? act.map(p => p.date).sort().slice(-1)[0] : (i.paidAt || '');
            const paidAmt = (st === 'paid' && act.length === 0) ? invTotal(i) : paidSoFar(i);
            const bal = st === 'paid' ? 0 : balanceOf(i);
            return [label, paidAmt, bal, last, act.map(p => p.reference).filter(Boolean).join(' | ')];
        }

        // --- MONEY & AGEING HELPERS ---
        function formatMoney(n, cur) {
            return `${cur || 'KES'} ${Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }
        function daysAtStage(inv) {
            let t = inv.stageSince ? Date.parse(inv.stageSince) : NaN;
            if (isNaN(t)) {
                const h = inv.history && inv.history[inv.history.length - 1];
                if (h && h.timestamp) {
                    const m = String(h.timestamp).match(/\(([^)]*)\)/);
                    t = Date.parse(m ? m[1] : h.timestamp);
                }
            }
            if (isNaN(t)) return null;
            return Math.max(0, Math.floor((Date.now() - t) / 86400000));
        }
        function ageBadge(inv) {
            if (inv.currentStage === STAGES.COMPLETED) return '';
            const d = daysAtStage(inv);
            if (d === null) return '';
            const cls = d >= 7 ? 'bg-rose-50 text-rose-700 border-rose-200' : d >= 3 ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-slate-50 text-slate-500 border-slate-200';
            return `<div class="mt-1.5"><span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold border ${cls}"><i class="fa-regular fa-clock mr-1"></i>${d === 0 ? 'Today' : d + (d === 1 ? ' day' : ' days')} at this stage</span></div>`;
        }

        // --- DUPLICATE CHECK ---
        function escapeHtml(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function normInvoiceNo(v) { return String(v || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
        function normAmount(v) {
            const m = String(v || '').replace(/,/g, '').match(/\d+(\.\d+)?/);
            return m ? parseFloat(m[0]) : null;
        }
        // exact = same invoice number + supplier + amount; partial = same number + supplier, different amount
        window.findDuplicateInvoices = function(invoiceNumber, supplierName, amount, excludeId) {
            const n = normInvoiceNo(invoiceNumber);
            const sup = String(supplierName || '').trim().toLowerCase();
            if (!n || !sup) return { exact: [], partial: [] };
            const a = normAmount(amount);
            const same = window.appState.invoices.filter(i => i.id !== excludeId &&
                normInvoiceNo(i.invoiceNumber) === n && String(i.supplierName || '').trim().toLowerCase() === sup);
            const exact = same.filter(i => normAmount(i.amount) === a);
            return { exact, partial: same.filter(i => !exact.includes(i)) };
        };
        function describeInvoice(i) {
            const first = (i.history && i.history[0] && i.history[0].timestamp) ? ' &middot; received ' + escapeHtml(i.history[0].timestamp) : '';
            return `<li><b>#${escapeHtml(i.invoiceNumber)}</b> &middot; ${escapeHtml(i.supplierName)} &middot; ${escapeHtml(i.amount || 'no amount')} &mdash; now at <i>${escapeHtml(i.currentStage)}</i>${first}</li>`;
        }

        // --- EXPORT DIALOG (filter by supplier / stage) ---
        window.openExportDialog = function(scope) {
            const scoped = getExportList(scope);
            if (!scoped.length) { window.showToast('No invoices to export.', 'warning'); return; }

            // suppliers that actually have invoices in this scope
            const counts = {};
            scoped.forEach(i => {
                const n = String(i.supplierName || '').trim();
                counts[n] = (counts[n] || 0) + 1;
            });
            const supplierNames = Object.keys(counts).sort((a, b) => a.localeCompare(b));
            const scopeLabel = scope === 'completed' ? 'completed invoices' : scope === 'incomplete' ? 'incomplete invoices' : 'all invoices';
            const stageOptions = Object.values(STAGES);

            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fadeIn">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100">
                        <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl mb-4">
                            <i class="fa-solid fa-file-export"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">Export Invoices</h3>
                        <p class="text-slate-500 text-xs mb-5">Exporting from ${scopeLabel}. Pick a supplier or stage, or leave them on "All" to export everything.</p>

                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Supplier</label>
                        <select id="export-supplier" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-4">
                            <option value="-1">All suppliers (${scoped.length})</option>
                            ${supplierNames.map((n, idx) => `<option value="${idx}">${escapeHtml(n)} (${counts[n]})</option>`).join('')}
                        </select>

                        ${scope === 'all' ? `
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Stage</label>
                            <select id="export-stage" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-4">
                                <option value="">All stages</option>
                                ${stageOptions.map(st => `<option value="${escapeHtml(st)}">${escapeHtml(st)}</option>`).join('')}
                            </select>
                        ` : ''}
                        ${kindOptions(scoped).length > 1 || scoped.some(i => i.type === 'direct') ? `
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Type / category</label>
                            <select id="export-kind" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 mb-4">
                                <option value="">All invoices</option>
                                ${kindOptions(scoped).map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('')}
                            </select>` : ''}


                        <p id="export-count" class="text-xs font-semibold text-emerald-700 mb-5"></p>

                        <div class="flex space-x-3 justify-end">
                            <button id="export-cancel" class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition">Cancel</button>
                            <button id="export-go" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-lg shadow-emerald-600/20 transition disabled:opacity-40 disabled:cursor-not-allowed">
                                <i class="fa-solid fa-download mr-2"></i>Download CSV
                            </button>
                        </div>
                    </div>
                </div>
            `;

            const supSel = document.getElementById('export-supplier');
            const stageSel = document.getElementById('export-stage');
            const kindSel = document.getElementById('export-kind');
            const countEl = document.getElementById('export-count');
            const goBtn = document.getElementById('export-go');

            const currentFilters = () => {
                const idx = parseInt(supSel.value, 10);
                return {
                    supplier: idx >= 0 ? supplierNames[idx] : '',
                    stage: stageSel ? stageSel.value : '',
                    kind: kindSel ? kindSel.value : ''
                };
            };
            const refresh = () => {
                const n = getExportList(scope, currentFilters()).length;
                countEl.textContent = n === 0 ? 'No invoices match these filters.' : `${n} invoice${n === 1 ? '' : 's'} will be exported.`;
                countEl.className = 'text-xs font-semibold mb-5 ' + (n === 0 ? 'text-rose-600' : 'text-emerald-700');
                goBtn.disabled = n === 0;
            };
            supSel.onchange = refresh;
            if (stageSel) stageSel.onchange = refresh;
            if (kindSel) kindSel.onchange = refresh;
            refresh();

            document.getElementById('export-cancel').onclick = () => { modalContainer.innerHTML = ''; };
            goBtn.onclick = () => {
                const f = currentFilters();
                modalContainer.innerHTML = '';
                window.exportInvoicesCsv(scope, f);
            };
        };

        // --- EXPORT TO CSV (opens in Excel) ---
        function getExportList(scope, filters = {}) {
            const all = window.appState.invoices;
            let list = scope === 'completed' ? all.filter(i => i.currentStage === STAGES.COMPLETED)
                : scope === 'incomplete' ? all.filter(i => i.currentStage === STAGES.INCOMPLETE) : all;
            if (filters.supplier) {
                const sup = filters.supplier.trim().toLowerCase();
                list = list.filter(i => String(i.supplierName || '').trim().toLowerCase() === sup);
            }
            if (filters.stage) list = list.filter(i => i.currentStage === filters.stage);
            if (filters.kind) list = list.filter(i => matchesKind(i, filters.kind));
            return list;
        }

        window.exportInvoicesCsv = function(scope, filters = {}) {
            const list = getExportList(scope, filters);
            if (!list.length) { window.showToast('No invoices match those filters.', 'warning'); return; }
            const esc = (v) => {
                let t = String(v == null ? '' : v);
                if (/^[=+@]/.test(t)) t = "'" + t; // stop spreadsheet formula injection
                t = t.replace(/"/g, '""');
                return /[",\n\r]/.test(t) ? '"' + t + '"' : t;
            };
            const header = ['Invoice Number', 'Supplier', 'Amount', 'Amount (number)', 'Description', 'Current Stage', 'Type', 'Category', 'Date Received', 'Added By', 'Last Action', 'Last Updated By', 'Last Updated', 'Incomplete Note', 'Payment Status', 'Total Paid', 'Balance', 'Last Payment Date', 'Payment References', 'Full History'];
            const rows = list.map(i => {
                const h = i.history || [];
                const first = h[0] || {};
                const last = h[h.length - 1] || {};
                return [
                    i.invoiceNumber, i.supplierName, i.amount, (i.amountValue != null ? i.amountValue : normAmount(i.amount)), i.description, i.currentStage, (i.type === 'direct' ? 'Direct to Billing' : 'Standard'), (i.category || ''),
                    first.timestamp, first.user, last.action, last.user, last.timestamp, i.incompleteNote, ...paymentExportCells(i),
                    h.map(x => `${x.stage} - ${x.user} - ${x.timestamp} - ${x.action}`).join(' | ')
                ];
            });
            const csv = '\uFEFF' + [header, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const slug = (t) => String(t).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const parts = ['majani-invoices', scope];
            if (filters.supplier) parts.push(slug(filters.supplier));
            if (filters.stage) parts.push(slug(filters.stage));
            if (filters.kind) parts.push(slug(filters.kind.replace(':', '-')));
            parts.push(new Date().toISOString().split('T')[0]);
            a.download = parts.join('-') + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            window.showToast(`Exported ${list.length} invoice${list.length === 1 ? '' : 's'}.`);
        };

        // --- INCOMPLETE INVOICES ---
        window.markInvoiceIncomplete = function(id) {
            const user = window.appState.currentUser;
            if (user.role !== 'Main Store' && user.role !== 'Admin') {
                window.showToast('Only Main Store (Alimah) can mark an invoice as incomplete.', 'error');
                return;
            }
            const inv = window.appState.invoices.find(i => i.id === id);
            if (!inv || inv.currentStage !== STAGES.STORE) return;
            const note = prompt(`What is missing or incomplete on invoice #${escapeHtml(inv.invoiceNumber)}? (e.g. no delivery note, missing LPO)`, '');
            if (note === null) return;
            window.showConfirmationModal(
                'Mark Invoice Incomplete',
                `Move invoice #${escapeHtml(inv.invoiceNumber)} to the Incomplete Invoices section? Alimah and Sharon will both be able to see and submit it from there.`,
                async () => {
                    inv.currentStage = STAGES.INCOMPLETE;
                    inv.stageSince = new Date().toISOString();
                    inv.incompleteNote = note.trim();
                    inv.history.push({
                        stage: STAGES.INCOMPLETE,
                        user: user.username,
                        timestamp: getCurrentTimestamp(),
                        action: 'Marked Incomplete' + (note.trim() ? ': ' + note.trim() : '')
                    });
                    await window.saveInvoiceToCloud(inv);
                    window.showToast(`Invoice #${escapeHtml(inv.invoiceNumber)} moved to Incomplete Invoices.`, 'warning');
                    window.render();
                },
                'Mark Incomplete',
                true
            );
        };

        // --- EDIT INVOICE ---
        window.editInvoice = function(id) {
            const user = window.appState.currentUser;
            const inv = window.appState.invoices.find(i => i.id === id);
            if (!inv) return;
            const allowed = (user.role === 'Admin' && inv.currentStage !== STAGES.COMPLETED) ||
                (user.role === 'Billing' && inv.type === 'direct' && inv.currentStage === STAGES.BILLING) ||
                (user.role === 'Main Store' && (inv.currentStage === STAGES.STORE || inv.currentStage === STAGES.INCOMPLETE));
            if (!allowed) { window.showToast('You cannot edit this invoice at its current stage.', 'error'); return; }

            const cur = inv.currency || 'KES';
            const parsed = inv.amountValue != null ? inv.amountValue : normAmount(inv.amount);
            const isInc = inv.currentStage === STAGES.INCOMPLETE;
            const mc = document.getElementById('modal-container');
            const field = 'w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500';
            mc.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fadeIn">
                    <form id="edit-inv-form" class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-100 space-y-4 max-h-[90vh] overflow-y-auto">
                        <h3 class="text-lg font-bold text-slate-900">Edit Invoice</h3>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Invoice Number</label>
                            <input id="edit-number" required value="${escapeHtml(inv.invoiceNumber)}" class="${field}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Supplier</label>
                            <input id="edit-supplier" required list="edit-supplier-list" value="${escapeHtml(inv.supplierName)}" class="${field}">
                            <datalist id="edit-supplier-list">${window.appState.suppliers.map(n => `<option value="${escapeHtml(n)}">`).join('')}</datalist>
                        </div>
                        ${inv.type === 'direct' ? `
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Category</label>
                            <input id="edit-category" list="edit-cat-list" value="${escapeHtml(inv.category || '')}" class="${field}">
                            <datalist id="edit-cat-list">${knownCategories().map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist>
                        </div>` : ''}

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Amount</label>
                            <div class="flex gap-2">
                                <select id="edit-currency" class="px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold">
                                    ${['KES', 'USD', 'EUR', 'GBP'].map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}
                                </select>
                                <input id="edit-amount" type="number" min="0" step="0.01" value="${parsed == null ? '' : parsed}" class="${field}">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Description / Items</label>
                            <input id="edit-desc" value="${escapeHtml(inv.description || '')}" class="${field}">
                        </div>
                        ${isInc ? `
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">What is missing?</label>
                                <input id="edit-note" value="${escapeHtml(inv.incompleteNote || '')}" class="${field}">
                            </div>` : ''}
                        <div class="flex justify-end space-x-3 pt-2">
                            <button type="button" id="edit-cancel" class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50">Cancel</button>
                            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-lg shadow-emerald-600/20">Save Changes</button>
                        </div>
                    </form>
                </div>`;
            document.getElementById('edit-cancel').onclick = () => { mc.innerHTML = ''; };
            document.getElementById('edit-inv-form').onsubmit = async (e) => {
                e.preventDefault();
                const num = document.getElementById('edit-number').value.trim();
                const sup = document.getElementById('edit-supplier').value.trim();
                const curNew = document.getElementById('edit-currency').value;
                const amtNum = parseFloat(document.getElementById('edit-amount').value);
                const desc = document.getElementById('edit-desc').value.trim();
                const noteEl = document.getElementById('edit-note');
                const catEl = document.getElementById('edit-category');
                const cat = catEl ? catEl.value.trim() : (inv.category || '');
                const note = noteEl ? noteEl.value.trim() : (inv.incompleteNote || '');
                if (!num || !sup) { window.showToast('Invoice number and supplier are required.', 'error'); return; }
                const amountStr = isNaN(amtNum) ? '' : formatMoney(amtNum, curNew);

                const changes = [];
                if (num !== inv.invoiceNumber) changes.push(`number ${inv.invoiceNumber} to ${num}`);
                if (sup !== inv.supplierName) changes.push(`supplier ${inv.supplierName} to ${sup}`);
                if (amountStr !== (inv.amount || '')) changes.push(`amount ${inv.amount || 'none'} to ${amountStr || 'none'}`);
                if (desc !== (inv.description || '')) changes.push('description');
                if (note !== (inv.incompleteNote || '')) changes.push('missing-details note');
                if (catEl && cat !== (inv.category || '')) changes.push(`category ${inv.category || 'none'} to ${cat}`);
                if (changes.length === 0) { mc.innerHTML = ''; return; }

                const d = window.findDuplicateInvoices(num, sup, amountStr, inv.id);
                if (d.exact.length > 0 && !confirm('Another invoice already has this same number, supplier and amount. Save anyway?')) return;

                inv.invoiceNumber = num;
                inv.supplierName = sup;
                inv.amount = amountStr;
                inv.amountValue = isNaN(amtNum) ? null : amtNum;
                inv.currency = curNew;
                inv.description = desc;
                if (noteEl) inv.incompleteNote = note;
                if (catEl) inv.category = cat;
                inv.history.push({
                    stage: inv.currentStage,
                    user: user.username,
                    timestamp: getCurrentTimestamp(),
                    action: 'Edited: ' + changes.join('; ')
                });
                if (!window.appState.suppliers.some(x => x.toLowerCase() === sup.toLowerCase())) {
                    await window.saveSupplierToCloud(sup);
                }
                await window.saveInvoiceToCloud(inv);
                mc.innerHTML = '';
                window.showToast('Invoice updated.');
                window.render();
            };
        };

        // --- DASHBOARD SEARCH / FILTER ---
        window.applyDashFilter = function() {
            const table = document.getElementById('dash-table');
            const f = window.appState.dashFilter;
            if (!table) return;
            const q = (f.q || '').trim().toLowerCase();
            let shown = 0, total = 0;
            table.querySelectorAll('tbody tr').forEach(tr => {
                total++;
                const ok = (!q || (tr.dataset.search || '').includes(q)) &&
                    (!f.supplier || tr.dataset.supplier === f.supplier) &&
                    (!f.stage || tr.dataset.stage === f.stage) &&
                    (!f.kind || f.kind === tr.dataset.kind || (f.kind === 'direct' && (tr.dataset.kind || '').startsWith('direct')));
                tr.style.display = ok ? '' : 'none';
                if (ok) shown++;
            });
            const c = document.getElementById('dash-count');
            if (c) c.textContent = (q || f.supplier || f.stage || f.kind) ? `Showing ${shown} of ${total}` : `${total} invoice${total === 1 ? '' : 's'}`;
        };
        window.setDashFilter = function() {
            const g = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
            window.appState.dashFilter = { q: g('dash-q'), supplier: g('dash-supplier'), stage: g('dash-stage'), kind: g('dash-kind') };
            window.applyDashFilter();
        };

        // --- FILING: CONFIRM RECEIPT, PAYMENTS, REVERSALS ---
        window.confirmFilingReceipt = function(id) {
            const user = window.appState.currentUser;
            const inv = window.appState.invoices.find(i => i.id === id);
            if (!inv || !canHandlePayments()) { window.showToast('Only Filing (Vivian) can confirm receipt.', 'error'); return; }
            if (inv.currentStage !== STAGES.FILING || inv.filingStatus === 'confirmed') return;
            window.showConfirmationModal(
                'Confirm Invoice Received',
                `Confirm that you have received invoice #${escapeHtml(inv.invoiceNumber)} from "${escapeHtml(inv.supplierName)}"? It will move to the <b>Unpaid</b> list.`,
                async () => {
                    inv.filingStatus = 'confirmed';
                    inv.stageSince = new Date().toISOString();
                    inv.history.push({ stage: STAGES.FILING, user: user.username, timestamp: getCurrentTimestamp(), action: 'Received & confirmed by Filing; marked Unpaid' });
                    await window.saveInvoiceToCloud(inv);
                    window.showToast(`Invoice #${escapeHtml(inv.invoiceNumber)} confirmed and moved to Unpaid.`);
                    window.appState.payTab = 'unpaid';
                    window.render();
                },
                'Confirm Received'
            );
        };

        window.openPaymentModal = function(id) {
            const user = window.appState.currentUser;
            const inv = window.appState.invoices.find(i => i.id === id);
            if (!inv || !canHandlePayments()) { window.showToast('Only Filing (Vivian) can record payments.', 'error'); return; }
            if (inv.currentStage !== STAGES.FILING || inv.filingStatus !== 'confirmed') { window.showToast('Confirm receipt of the invoice first.', 'warning'); return; }
            const total = invTotal(inv);
            const bal = balanceOf(inv);
            const cur = invCurrency(inv);
            const today = new Date().toISOString().split('T')[0];
            const field = 'w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500';
            const mc = document.getElementById('modal-container');
            mc.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fadeIn">
                    <form id="pay-form" class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100 space-y-4 max-h-[90vh] overflow-y-auto">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900">Record Payment</h3>
                            <p class="text-xs text-slate-500 mt-1">Invoice #${escapeHtml(inv.invoiceNumber)} &middot; ${escapeHtml(inv.supplierName)}</p>
                        </div>
                        ${total != null ? `
                            <div class="grid grid-cols-3 gap-2 text-center text-xs">
                                <div class="p-2 rounded-xl bg-slate-50 border"><div class="text-slate-400">Total</div><div class="font-bold text-slate-800">${escapeHtml(formatMoney(total, cur))}</div></div>
                                <div class="p-2 rounded-xl bg-slate-50 border"><div class="text-slate-400">Paid so far</div><div class="font-bold text-emerald-700">${escapeHtml(formatMoney(paidSoFar(inv), cur))}</div></div>
                                <div class="p-2 rounded-xl bg-slate-50 border"><div class="text-slate-400">Balance</div><div class="font-bold text-rose-700">${escapeHtml(formatMoney(bal, cur))}</div></div>
                            </div>` : `<p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-3">This invoice has no amount on record, so the balance cannot be worked out. Tick the box below when this payment settles it in full.</p>`}
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Payment Date</label>
                            <input type="date" id="pay-date" required max="${today}" value="${today}" class="${field}">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Amount Paid (${escapeHtml(cur)})</label>
                            <input type="number" id="pay-amount" required min="0.01" step="0.01" value="${bal != null ? bal : ''}" class="${field}">
                            ${total != null ? '<p class="text-[11px] text-slate-400 mt-1">Pre-filled with the full balance. Type a smaller amount for a part payment.</p>' : ''}
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Reference (optional)</label>
                            <input type="text" id="pay-ref" placeholder="M-Pesa code, bank transfer or cheque number" class="${field}">
                        </div>
                        ${total == null ? `<label class="flex items-center space-x-2 text-sm text-slate-700"><input type="checkbox" id="pay-settles" class="rounded"><span>This payment settles the invoice in full</span></label>` : ''}
                        <div class="flex justify-end space-x-3 pt-2">
                            <button type="button" id="pay-cancel" class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50">Cancel</button>
                            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-lg shadow-emerald-600/20">Save Payment</button>
                        </div>
                    </form>
                </div>`;
            document.getElementById('pay-cancel').onclick = () => { mc.innerHTML = ''; };
            document.getElementById('pay-form').onsubmit = async (e) => {
                e.preventDefault();
                const date = document.getElementById('pay-date').value;
                const amt = round2(parseFloat(document.getElementById('pay-amount').value));
                const ref = document.getElementById('pay-ref').value.trim();
                const settlesBox = document.getElementById('pay-settles');
                if (!date) { window.showToast('Enter the payment date.', 'error'); return; }
                if (!(amt > 0)) { window.showToast('Enter an amount greater than zero.', 'error'); return; }
                if (total != null && amt > bal + 0.004) {
                    window.showToast(`That is more than the balance of ${formatMoney(bal, cur)}.`, 'error');
                    return;
                }
                inv.payments = (inv.payments || []).concat([{
                    id: 'PAY-' + Date.now(), date: date, amount: amt, reference: ref,
                    by: user.username, at: new Date().toISOString()
                }]);
                const newBal = balanceOf(inv);
                const settled = total != null ? newBal <= 0.004 : !!(settlesBox && settlesBox.checked);
                inv.history.push({
                    stage: STAGES.FILING, user: user.username, timestamp: getCurrentTimestamp(),
                    action: `Payment recorded: ${formatMoney(amt, cur)} on ${date}` + (ref ? ` (ref ${ref})` : '') +
                        (settled ? '. Paid in full - invoice completed' : (newBal != null ? `. Balance ${formatMoney(newBal, cur)}` : ''))

                    inv.stageSince = new Date().toISOString();

                window.render();
            };

                                        ${list.map(pm => `
                                            <tr class="${pm.reversed ? 'text-slate-400 line-through' : 'text-slate-700'}">
                                                <td class="py-2 pr-3">${escapeHtml(pm.date)}</td>
                                                <td class="py-2 pr-3 font-semibold">${escapeHtml(formatMoney(pm.amount, cur))}</td>
                                                <td class="py-2 pr-3">${escapeHtml(pm.reference || '-')}</td>
                                                <td class="py-2 pr-3">${escapeHtml(pm.by || '')}</td>
                                                <td class="py-2 pr-3 no-underline">${pm.reversed ? `<span class="text-rose-600 not-italic" style="text-decoration:none;display:inline-block">Reversed: ${escapeHtml(pm.reverseReason || '')}</span>` : 'Active'}</td>
                                                <td class="py-2 text-right">${canEdit && !pm.reversed ? `<button type="button" onclick="reversePayment('${inv.id}', '${pm.id}')" class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-semibold">Reverse</button>` : ''}</td>
                                            </tr>`).join('')}
                                    </tbody>
                                </table>
                            </div>`}
                        <div class="flex flex-wrap justify-end gap-3">
                            ${canEdit && legacyPaid ? `<button type="button" onclick="reopenAsUnpaid('${inv.id}')" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold">Move back to Unpaid</button>` : ''}
                            ${canEdit && inv.currentStage === STAGES.FILING && inv.filingStatus === 'confirmed' ? `<button type="button" onclick="openPaymentModal('${inv.id}')" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold">Record Payment</button>` : ''}
                            <button type="button" id="pay-close" class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50">Close</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('pay-close').onclick = () => { mc.innerHTML = ''; };
        };

        window.reversePayment = function(id, payId) {
            const user = window.appState.currentUser;
            if (!canHandlePayments()) { window.showToast('Only Filing (Vivian) or Admin can reverse a payment.', 'error'); return; }
            const inv = window.appState.invoices.find(i => i.id === id);
            const pm = inv && (inv.payments || []).find(x => x.id === payId);
            if (!inv || !pm || pm.reversed) return;
            const cur = invCurrency(inv);
            const reason = prompt(`Why is the payment of ${formatMoney(pm.amount, cur)} (${pm.date}) being reversed? (required)`, '');
            if (reason === null) return;
            if (!reason.trim()) { window.showToast('A reason is required to reverse a payment.', 'warning'); return; }
            window.showConfirmationModal(
                'Reverse Payment',
                `Reverse the payment of <b>${escapeHtml(formatMoney(pm.amount, cur))}</b> on ${escapeHtml(pm.date)} for invoice #${escapeHtml(inv.invoiceNumber)}?<br><span class="text-xs text-slate-500">Reason: ${escapeHtml(reason.trim())}</span>`,
                async () => {
                    pm.reversed = true;
                    pm.reversedBy = user.username;
                    pm.reversedAt = new Date().toISOString();
                    pm.reverseReason = reason.trim();
                    const wasComplete = inv.currentStage === STAGES.COMPLETED;
                    if (wasComplete) {
                        inv.currentStage = STAGES.FILING;
                        inv.filingStatus = 'confirmed';
                        inv.stageSince = new Date().toISOString();
                        inv.paidAt = '';
                    }
                    inv.history.push({
                        stage: STAGES.FILING, user: user.username, timestamp: getCurrentTimestamp(),
                        action: `Payment reversed: ${formatMoney(pm.amount, cur)} on ${pm.date}` + (pm.reference ? ` (ref ${pm.reference})` : '') + ` - ${reason.trim()}` + (wasComplete ? '. Invoice moved back to Unpaid' : '')
                    });
                    await window.saveInvoiceToCloud(inv);
                    document.getElementById('modal-container').innerHTML = '';
                    window.showToast('Payment reversed.', 'warning');
                    if (wasComplete) window.appState.payTab = 'unpaid';
                    window.render();
                },
                'Reverse Payment',
                true
            );
        };

        window.reopenAsUnpaid = function(id) {
            const user = window.appState.currentUser;
            if (!canHandlePayments()) return;
            const inv = window.appState.invoices.find(i => i.id === id);
            if (!inv || inv.currentStage !== STAGES.COMPLETED) return;
            const reason = prompt(`Why is invoice #${inv.invoiceNumber} being moved back to Unpaid? (required)`, '');
            if (reason === null) return;
            if (!reason.trim()) { window.showToast('A reason is required.', 'warning'); return; }
            window.showConfirmationModal(
                'Move Back to Unpaid',
                `Move invoice #${escapeHtml(inv.invoiceNumber)} back to the <b>Unpaid</b> list?<br><span class="text-xs text-slate-500">Reason: ${escapeHtml(reason.trim())}</span>`,
                async () => {
                    inv.currentStage = STAGES.FILING;
                    inv.filingStatus = 'confirmed';
                    inv.stageSince = new Date().toISOString();
                    inv.paidAt = '';
                    inv.history.push({ stage: STAGES.FILING, user: user.username, timestamp: getCurrentTimestamp(), action: `Moved back to Unpaid: ${reason.trim()}` });
                    await window.saveInvoiceToCloud(inv);
                    document.getElementById('modal-container').innerHTML = '';
                    window.showToast('Invoice moved back to Unpaid.', 'warning');
                    window.appState.payTab = 'unpaid';
                    window.render();
                },
                'Move to Unpaid',
                true
            );
        };

        window.setPayTab = function(tab) { window.appState.payTab = tab; window.render(); };

        function renderPaymentsTab() {
            const user = window.appState.currentUser;
            if (user.role !== 'Filing' && user.role !== 'Admin') {
                return '<div class="p-12 text-center text-slate-500 text-sm">The Payments section is for Filing (Vivian) and Admin.</div>';
            }
            const all = window.appState.invoices;
            const lists = {
                confirm: all.filter(i => payState(i) === 'confirm'),
                unpaid: all.filter(i => ['unpaid', 'part'].includes(payState(i))),
                paid: all.filter(i => i.currentStage === STAGES.COMPLETED)
            };
            lists.unpaid.sort((a, b) => (daysAtStage(b) ?? -1) - (daysAtStage(a) ?? -1));
            lists.paid.sort((a, b) => String(b.paidAt || '').localeCompare(String(a.paidAt || '')));
            const tab = window.appState.payTab || 'confirm';
            const list = lists[tab] || [];

            const owed = {};
            lists.unpaid.forEach(i => { const b = balanceOf(i); if (b != null) owed[invCurrency(i)] = round2((owed[invCurrency(i)] || 0) + b); });
            const owedText = Object.keys(owed).map(c => formatMoney(owed[c], c)).join(' + ');

            const tabBtn = (key, label, count, color) => `
                <button onclick="setPayTab('${key}')" class="px-4 py-2 rounded-xl text-sm font-semibold border transition ${tab === key ? color + ' shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                    ${label} <span class="ml-1 text-xs opacity-80">(${count})</span>
                </button>`;

            const emptyMsg = { confirm: 'Nothing waiting for confirmation. Invoices submitted by Billing appear here first.', unpaid: 'No unpaid invoices.', paid: 'No paid invoices yet.' }[tab];

            return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-slate-900 text-base">Payments</h3>
                            <p class="text-xs text-slate-500 mt-0.5">Confirm invoices received from Billing, then record payments (full or in parts). An invoice is completed once it is paid in full.</p>
                        </div>
                        <div class="flex items-center gap-3">
                            ${owedText ? `<span class="px-3 py-1.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold">Still to pay: ${escapeHtml(owedText)}</span>` : ''}
                            <button onclick="openExportDialog('all')" class="inline-flex items-center space-x-2 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-300 transition"><i class="fa-solid fa-file-export"></i><span>Export</span></button>
                        </div>
                    </div>
                    <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap gap-2">
                        ${tabBtn('confirm', 'To Confirm', lists.confirm.length, 'bg-indigo-600 text-white border-indigo-600')}
                        ${tabBtn('unpaid', 'Unpaid', lists.unpaid.length, 'bg-rose-600 text-white border-rose-600')}
                        ${tabBtn('paid', 'Paid', lists.paid.length, 'bg-emerald-600 text-white border-emerald-600')}
                    </div>
                    ${list.length === 0 ? `<div class="p-12 text-center text-slate-400 text-sm">${emptyMsg}</div>` : `
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50/70 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider font-semibold">
                                        <th class="p-4">Invoice #</th>
                                        <th class="p-4">Supplier</th>
                                        <th class="p-4">Total</th>
                                        <th class="p-4">Paid</th>
                                        <th class="p-4">Balance</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${list.map(inv => {
                                        const cur = invCurrency(inv);
                                        const total = invTotal(inv);
                                        const legacyPaid = inv.currentStage === STAGES.COMPLETED && activePayments(inv).length === 0;
                                        const paid = legacyPaid && total != null ? total : paidSoFar(inv);
                                        const bal = inv.currentStage === STAGES.COMPLETED ? 0 : balanceOf(inv);
                                        return `
                                        <tr class="hover:bg-slate-50/50 transition">
                                            <td class="p-4 font-bold text-slate-800">${escapeHtml(inv.invoiceNumber)}${typeTag(inv)}</td>
                                            <td class="p-4 font-medium text-slate-700">${escapeHtml(inv.supplierName)}</td>
                                            <td class="p-4 font-semibold text-slate-800">${escapeHtml(total != null ? formatMoney(total, cur) : (inv.amount || 'N/A'))}</td>
                                            <td class="p-4 text-emerald-700 font-semibold">${tab === 'confirm' ? '-' : escapeHtml(formatMoney(paid, cur))}</td>
                                            <td class="p-4 ${bal ? 'text-rose-700' : 'text-slate-500'} font-semibold">${tab === 'confirm' ? '-' : (bal == null ? 'unknown' : escapeHtml(formatMoney(bal, cur)))}</td>
                                            <td class="p-4">
                                                ${tab === 'paid' ? `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">Paid${inv.paidAt ? ' ' + escapeHtml(inv.paidAt) : ''}</span>` : payBadge(inv) + ageBadge(inv)}
                                                ${inv.returnNote && tab === 'confirm' ? `<div class="text-xs text-rose-600 font-semibold mt-1">Returned: ${escapeHtml(inv.returnNote)}</div>` : ''}
                                            </td>
                                            <td class="p-4 text-right space-x-2">
                                                ${tab === 'paid' ? `<button onclick="openPaymentsHistory('${inv.id}')" class="px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 text-xs font-semibold">Payments</button>` : getRoleActionButtons(inv)}
                                            </td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
        }

        // --- SUPPLIER EDIT / DELETE ---
        async function findSupplierDocs(name) {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'suppliers'), where('name', '==', name));
            const snap = await getDocs(q);
            return snap.docs;
        }

        window.editSupplier = async function(idx) {
            const oldName = window.appState.suppliers[idx];
            if (oldName === undefined) return;
            const input = prompt('Edit supplier name:', oldName);
            if (input === null) return;
            const newName = input.trim();
            if (!newName || newName === oldName) return;
            if (window.appState.suppliers.some((s, i) => i !== idx && s.toLowerCase() === newName.toLowerCase())) {
                window.showToast('A supplier with that name already exists.', 'warning');
                return;
            }
            try {
                if (isFirebaseActive && db) {
                    const docs = await findSupplierDocs(oldName);
                    if (docs.length === 0) { window.showToast('Supplier not found in database.', 'error'); return; }
                    for (const d of docs) await updateDoc(d.ref, { name: newName });
                    // keep existing invoices pointing at the renamed supplier
                    const invQ = query(collection(db, 'artifacts', appId, 'public', 'data', 'invoices'), where('supplierName', '==', oldName));
                    const invSnap = await getDocs(invQ);
                    for (const d of invSnap.docs) await updateDoc(d.ref, { supplierName: newName });
                } else {
                    window.appState.suppliers[idx] = newName;
                    setLocalStorage('suppliers', window.appState.suppliers);
                    window.appState.invoices.forEach(inv => { if (inv.supplierName === oldName) inv.supplierName = newName; });
                    setLocalStorage('invoices', window.appState.invoices);
                    window.render();
                }
                window.showToast('Supplier updated!');
            } catch (e) {
                console.error('Error editing supplier:', e);
                window.showToast('Could not update supplier. Check your connection or database rules.', 'error');
            }
        };

        window.deleteSupplier = function(idx) {
            const name = window.appState.suppliers[idx];
            if (name === undefined) return;
            if (window.appState.suppliers.length <= 1) {
                window.showToast('At least one supplier must remain.', 'warning');
                return;
            }
            window.showConfirmationModal(
                'Delete Supplier',
                `Delete "${name}" from the suppliers directory? Existing invoices from this supplier will keep their name.`,
                async () => {
                    try {
                        if (isFirebaseActive && db) {
                            const docs = await findSupplierDocs(name);
                            for (const d of docs) await deleteDoc(d.ref);
                        } else {
                            window.appState.suppliers.splice(idx, 1);
                            setLocalStorage('suppliers', window.appState.suppliers);
                            window.render();
                        }
                        window.showToast('Supplier deleted.');
                    } catch (e) {
                        console.error('Error deleting supplier:', e);
                        window.showToast('Could not delete supplier. Check your connection or database rules.', 'error');
                    }
                }
            );
        };

        // --- AUTH STATE ---
        if (isFirebaseActive) {
            onAuthStateChanged(auth, async (fbUser) => {
                window.appState.authReady = true;
                if (!fbUser) {
                    stopListeners();
                    window.appState.currentUser = null;
                    window.render();
                    return;
                }
                if (fbUser.isAnonymous) { await signOut(auth); return; } // leftover session from the old version
                try {
                    const snap = await getDoc(doc(db, ...dataPath, 'users', fbUser.uid));
                    const prof = snap.exists() ? snap.data() : null;
                    if (!prof || !ROLES.includes(prof.role)) {
                        window.appState.authError = 'Your login works but has no role yet. Ask the Admin to set you up.';
                        await signOut(auth);
                        return;
                    }
                    window.appState.currentUser = {
                        id: fbUser.uid, uid: fbUser.uid, email: fbUser.email,
                        username: prof.username || fbUser.email, role: prof.role,
                        avatar: prof.avatar || ROLE_AVATARS[prof.role] || ''
                    };
                    window.appState.authError = '';
                    window.appState.activeTab = 'dashboard';
                    startListeners();
                    window.render();
                    window.showToast('Welcome, ' + window.appState.currentUser.username + '!');
                } catch (e) {
                    console.error('Profile load failed:', e);
                    window.appState.authError = 'Could not load your profile (' + ((e && e.code) || 'error') + '). Check the Firestore rules.';
                    await signOut(auth);
                }
            });
        } else {
            window.appState.authReady = true;
        }

        // Initialize App
        window.render();
    </script>
</body>
</html>
