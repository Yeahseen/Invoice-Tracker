<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majani Mingi Sisal Estate - Invoice Tracking System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-50 font-sans text-slate-900 antialiased flex flex-col">

    <!-- App Root Container -->
    <div id="app" class="min-h-full flex flex-col">
        <!-- Rendered dynamically by JS -->
    </div>

    <!-- Custom Modal Container -->
    <div id="modal-container"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Firebase SDK Modular Scripts -->
    <script type="module">
        import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut,
            createUserWithEmailAndPassword,
            sendPasswordResetEmail,
            updatePassword
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            collection, 
            onSnapshot,
            getDocs,
            deleteDoc,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // APP CONSTANTS & DEFAULTS
        const ROLES = ['Main Store', 'Procurement', 'Billing', 'Filing', 'Admin'];
        const ROLE_AVATARS = { 'Main Store': '🌱', 'Procurement': '📋', 'Billing': '💳', 'Filing': '📁', 'Admin': '👑' };

        const DEFAULT_SUPPLIERS = [
            'Greenfields Farm Inputs Ltd',
            'Sisal Machinery & Parts Co.',
            'Rift Valley Logistics',
            'Nakuru General Hardware',
            'Agro-Chem Supplies Kenya',
            'Kipkelion Fuel & Oils'
        ];

        const STAGES = {
            STORE: 'Main Store (Alimah)',
            PROCUREMENT: 'Procurement (Sharon)',
            BILLING: 'Billing (Lilian)',
            FILING: 'Filing (Vivian)',
            COMPLETED: 'Completed',
            INCOMPLETE: 'Incomplete'
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'majani-mingi-sisal';
        
let firebaseConfig = {
apiKey: "AIzaSyBvAz6WKpw8_FKXzY2_7Snb6tniqCQt3Rg",
  authDomain: "invoice-tracker-7e45b.firebaseapp.com",
  projectId: "invoice-tracker-7e45b",
  storageBucket: "invoice-tracker-7e45b.firebasestorage.app",
  messagingSenderId: "230517810322",
  appId: "1:230517810322:web:8133231ed62db30721f24b"

        };

        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try {
                firebaseConfig = JSON.parse(__firebase_config);
            } catch(e) { console.warn("Using default demo firebase config"); }
        }

        // Initialize Firebase
        let app, db, auth;
        let isFirebaseActive = false;
        let firebaseStatus = 'Connecting...';

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            isFirebaseActive = true;
            firebaseStatus = 'Secure Sync';
        } catch (err) {
            console.warn("Firebase fallback mode:", err);
            isFirebaseActive = false;
            firebaseStatus = 'Offline (Local Backup Mode)';
        }

        // --- GLOBAL APP STATE ---
        window.appState = {
            currentUser: null,
            authReady: false,
            authError: '',
            legacyUserDocs: 0,
            dashFilter: { q: '', supplier: '', stage: '', kind: '' },
            activeTab: 'dashboard',
            invoices: [],
            suppliers: DEFAULT_SUPPLIERS,
            users: [],
            firebaseStatus: firebaseStatus,
            isFirebaseActive: isFirebaseActive,
            db: db,
            appId: appId
        };

        // Local Storage Helpers
        function getLocalStorage(key, fallback) {
            const d = localStorage.getItem(`majani_${key}`);
            return d ? JSON.parse(d) : fallback;
        }

        function setLocalStorage(key, val) {
            localStorage.setItem(`majani_${key}`, JSON.stringify(val));
        }

        // Initial Local Fallbacks
        if (!localStorage.getItem('majani_suppliers')) setLocalStorage('suppliers', DEFAULT_SUPPLIERS);

        // Load Local initial values
        window.appState.users = [];
        window.appState.suppliers = getLocalStorage('suppliers', DEFAULT_SUPPLIERS);
        window.appState.invoices = [];

        // --- FIREBASE REALTIME LISTENERS (started only after sign-in) ---
        const dataPath = ['artifacts', appId, 'public', 'data'];
        let unsubscribers = [];
        function stopListeners() { unsubscribers.forEach(u => { try { u(); } catch (e) {} }); unsubscribers = []; }
        function onListenError(label, err) {
            console.error('Firestore ' + label + ' error:', err);
            if (err && err.code === 'permission-denied') window.showToast('Access denied while loading ' + label + '. Check the Firestore rules and your role.', 'error');
        }
        // Re-draw unless the person is typing, so a live update never wipes a form or search box
        function softRender() {
            const a = document.activeElement;
            if (a && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName) && document.getElementById('app').contains(a)) return;
            if (window.appState.activeTab === 'add') return;
            window.render();
        }
        function startListeners() {
            stopListeners();
            unsubscribers.push(onSnapshot(collection(db, ...dataPath, 'invoices'), (snapshot) => {
                const items = [];
                snapshot.forEach(d => items.push({ id: d.id, ...d.data() }));
                window.appState.invoices = items;
                softRender();
            }, (e) => onListenError('invoices', e)));

            unsubscribers.push(onSnapshot(collection(db, ...dataPath, 'suppliers'), (snapshot) => {
                const sups = [];
                snapshot.forEach(d => sups.push(d.data().name));
                const role = window.appState.currentUser && window.appState.currentUser.role;
                if (sups.length > 0) {
                    window.appState.suppliers = sups;
                    softRender();
                } else if (role === 'Admin' || role === 'Main Store') {
                    DEFAULT_SUPPLIERS.forEach((name, idx) => {
                        setDoc(doc(db, ...dataPath, 'suppliers', `SUP-${idx}`), { name });
                    });
                }
            }, (e) => onListenError('suppliers', e)));

            unsubscribers.push(onSnapshot(collection(db, ...dataPath, 'users'), (snapshot) => {
                const list = [];
                let legacy = 0;
                snapshot.forEach(d => {
                    const data = d.data();
                    if (data.uid) list.push({ id: d.id, ...data });
                    else legacy++;
                });
                window.appState.users = list;
                window.appState.legacyUserDocs = legacy;
                const me = window.appState.currentUser;
                if (me) {
                    const mine = list.find(u => u.id === me.id);
                    if (!mine) {
                        if (list.length > 0) { window.showToast('Your access has been removed.', 'error'); window.logout(); }
                        return;
                    }
                    if (mine.role !== me.role) { me.role = mine.role; me.avatar = mine.avatar || ROLE_AVATARS[mine.role]; }
                }
                softRender();
            }, (e) => onListenError('users', e)));
        }

        // SYNC STATE TO FIREBASE OR LOCAL
        window.saveInvoiceToCloud = async function(invoice) {
            if (isFirebaseActive && db) {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'invoices', invoice.id), invoice);
                } catch(e ) { console.error("Error saving invoice:", e); window.showToast('Could not save invoice (' + (e.code || 'error') + '). Check Firestore rules.', 'error'); }
            } else {
                let invoices = window.appState.invoices;
                const idx = invoices.findIndex(i => i.id === invoice.id);
                if (idx >= 0) invoices[idx] = invoice;
                else invoices.push(invoice);
                setLocalStorage('invoices', invoices);
                window.render();
            }
        };

        window.saveSupplierToCloud = async function(supplierName) {
            if (isFirebaseActive && db) {
                try {
                    const supId = 'SUP-' + Date.now();
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'suppliers', supId), { name: supplierName });
                    return true;
                } catch(e) {
                    console.error("Error saving supplier:", e);
                    window.showToast('Could not save supplier (' + (e.code || 'error') + '). Check Firestore rules.', 'error');
                    return false;
                }
            } else {
                let sups = window.appState.suppliers;
                if (!sups.includes(supplierName)) {
                    sups.push(supplierName);
                    setLocalStorage('suppliers', sups);
                    window.render();
                }
                return true;
            }
        };

        // --- UI UTILITY FUNCTIONS ---
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-amber-600';
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0 text-sm font-medium z-50`;
            
            let icon = 'fa-circle-check';
            if (type === 'error') icon = 'fa-circle-exclamation';
            if (type === 'warning') icon = 'fa-triangle-exclamation';

            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        window.showConfirmationModal = function(title, message, onConfirm, confirmLabel = 'Confirm & Proceed', danger = false) {
            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fadeIn">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100">
                        <div class="w-12 h-12 rounded-full ${danger ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'} flex items-center justify-center text-xl mb-4">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-2">${title}</h3>
                        <p class="text-slate-600 text-sm mb-6 leading-relaxed">${message}</p>
                        <div class="flex space-x-3 justify-end">
                            <button id="modal-cancel" class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition">Cancel</button>
                            <button id="modal-confirm" class="px-5 py-2.5 rounded-xl ${danger ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-600/20' : 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20'} text-white text-sm font-semibold shadow-lg transition">${confirmLabel}</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('modal-cancel').onclick = () => {
                modalContainer.innerHTML = '';
            };

            document.getElementById('modal-confirm').onclick = () => {
                modalContainer.innerHTML = '';
                onConfirm();
            };
        };

        function getCurrentTimestamp() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            return `${dateStr} ${timeStr}`;
        }

        // --- RENDER APP ---
        window.render = function() {
            const app = document.getElementById('app');
            if (!window.appState.isFirebaseActive) {
                app.innerHTML = '<div class="min-h-screen flex items-center justify-center p-6 text-center"><div class="max-w-sm"><h1 class="text-lg font-bold text-slate-900 mb-2">Cannot connect</h1><p class="text-sm text-slate-500 mb-4">The system could not reach the database. Check your internet connection and reload the page.</p><button onclick="location.reload()" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-semibold">Reload</button></div></div>';
                return;
            }
            if (!window.appState.authReady) {
                app.innerHTML = '<div class="min-h-screen flex items-center justify-center text-slate-500 text-sm">Loading...</div>';
                return;
            }
            if (!window.appState.currentUser) {
                app.innerHTML = renderLoginScreen();
                bindLoginEvents();
            } else {
                app.innerHTML = renderMainLayout();
                bindMainLayoutEvents();
                if (window.applyDashFilter) window.applyDashFilter();
            }
        };

        // LOGIN SCREEN
        function renderLoginScreen() {
            const err = window.appState.authError;
            return `
                <div class="min-h-screen bg-gradient-to-br from-emerald-900 via-emerald-800 to-slate-900 flex flex-col justify-center items-center p-4">
                    <div class="max-w-md w-full bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/20">
                        <div class="text-center mb-6">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-600 text-white text-2xl shadow-lg shadow-emerald-600/30 mb-4">
                                <i class="fa-solid fa-file-invoice-dollar"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-slate-900">Majani Mingi Sisal Estate</h1>
                            <p class="text-slate-500 text-sm mt-1">Invoice Tracking System</p>
                        </div>

                        ${err ? `<div class="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700 font-medium">${escapeHtml(err)}</div>` : ''}

                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Email</label>
                                <input type="email" id="login-email" autocomplete="username" placeholder="you@example.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Password</label>
                                <input type="password" id="login-pin" autocomplete="current-password" placeholder="Enter password" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>
                            <button type="submit" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/30 transition duration-200 mt-2 disabled:opacity-60">
                                Sign In <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                            <button type="button" id="forgot-btn" class="w-full text-center text-xs font-semibold text-emerald-700 hover:underline">Forgot password?</button>
                        </form>
                    </div>
                    <div class="text-center mt-6 text-emerald-200/60 text-xs">
                        &copy; 2026 Majani Mingi Sisal Estate Ltd. Accounts are created by the Admin.
                    </div>
                </div>
            `;
        }

        function bindLoginEvents() {
            const form = document.getElementById('login-form');
            form.onsubmit = async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const pass = document.getElementById('login-pin').value;
                if (!email || !pass) {
                    window.showToast('Enter your email and password.', 'error');
                    return;
                }
                window.appState.authError = '';
                const btn = form.querySelector('button[type="submit"]');
                btn.disabled = true;
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                } catch (err) {
                    const code = (err && err.code) || '';
                    const msg = code === 'auth/too-many-requests' ? 'Too many attempts. Wait a few minutes or reset your password.'
                        : code === 'auth/network-request-failed' ? 'No internet connection. Please try again.'
                        : 'Incorrect email or password.';
                    window.showToast(msg, 'error');
                    btn.disabled = false;
                }
            };
            document.getElementById('forgot-btn').onclick = async () => {
                const email = document.getElementById('login-email').value.trim();
                if (!email) { window.showToast('Type your email above first.', 'warning'); return; }
                try { await sendPasswordResetEmail(auth, email); } catch (err) { console.warn('Reset email:', err && err.code); }
                window.showToast('If that email has an account, a reset link has been sent.');
            };
        }

        // MAIN LAYOUT
        function renderMainLayout() {
            const user = window.appState.currentUser;
            const invoices = window.appState.invoices;
            const suppliers = window.appState.suppliers;
            const activeTab = window.appState.activeTab;

            // Compute counts
            let pendingCount = 0;
            if (user.role === 'Main Store') pendingCount = invoices.filter(i => i.currentStage === STAGES.STORE).length;
            else if (user.role === 'Procurement') pendingCount = invoices.filter(i => i.currentStage === STAGES.PROCUREMENT).length;
            else if (user.role === 'Billing') pendingCount = invoices.filter(i => i.currentStage === STAGES.BILLING).length;
            else if (user.role === 'Filing') pendingCount = invoices.filter(i => i.currentStage === STAGES.FILING).length;
            else if (user.role === 'Admin') pendingCount = invoices.filter(i => i.currentStage !== STAGES.COMPLETED).length;

            const completedCount = invoices.filter(i => i.currentStage === STAGES.COMPLETED).length;
            const incompleteCount = invoices.filter(i => i.currentStage === STAGES.INCOMPLETE).length;
            const canSeeIncomplete = ['Main Store', 'Procurement', 'Admin'].includes(user.role);
            const canSeePayments = user.role === 'Filing' || user.role === 'Admin';
            const toConfirmCount = invoices.filter(i => payState(i) === 'confirm').length;

            return `
                <div class="min-h-full flex flex-col md:flex-row bg-slate-100 flex-1">
                    <!-- Sidebar -->
                    <aside class="w-full md:w-72 bg-slate-900 text-slate-300 flex flex-col justify-between border-r border-slate-800">
                        <div>
                            <!-- Brand Header -->
                            <div class="p-6 border-b border-slate-800 flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-lg shadow-md shadow-emerald-600/30">
                                    <i class="fa-solid fa-seedling"></i>
                                </div>
                                <div>
                                    <h2 class="font-bold text-white text-sm leading-tight">Majani Mingi</h2>
                                    <p class="text-xs text-slate-400">Sisal Estate Ltd</p>
                                </div>
                            </div>

                            <!-- Realtime Status Banner -->
                            <div class="px-4 py-2 bg-slate-800/50 border-b border-slate-800 flex items-center justify-between text-[11px]">
                                <span class="text-slate-400">Sync Status:</span>
                                <span class="font-semibold flex items-center space-x-1.5 ${window.appState.isFirebaseActive ? 'text-emerald-400' : 'text-amber-400'}">
                                    <span class="w-2 h-2 rounded-full ${window.appState.isFirebaseActive ? 'bg-emerald-400 animate-ping' : 'bg-amber-400'}"></span>
                                    <span>${window.appState.isFirebaseActive ? 'Live Sync' : 'Local'}</span>
                                </span>
                            </div>

                            <!-- User Info Badge -->
                            <div class="p-4 m-4 bg-slate-800/80 rounded-2xl border border-slate-700/60 flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg font-bold border border-emerald-500/30">
                                    ${user.avatar}
                                </div>
                                <div class="overflow-hidden">
                                    <h4 class="font-bold text-white text-sm truncate">${user.username}</h4>
                                    <span class="inline-block px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-semibold tracking-wide uppercase">${user.role}</span>
                                </div>
                            </div>

                            <!-- Navigation Menu -->
                            <nav class="px-4 space-y-1.5 mt-2">
                                <button onclick="switchTab('dashboard')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'dashboard' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}">
                                    <span class="flex items-center space-x-3"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard & Queue</span></span>
                                    ${pendingCount > 0 ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold ${activeTab === 'dashboard' ? 'bg-white text-emerald-700' : 'bg-emerald-500/20 text-emerald-400'}">${pendingCount}</span>` : ''}
                                </button>

                                ${(user.role === 'Main Store' || user.role === 'Admin' || user.role === 'Billing') ? `
                                    <button onclick="switchTab('add')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'add' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}">
                                        <i class="fa-solid fa-plus-circle w-5"></i><span>${user.role === 'Billing' ? 'Add Direct Invoice' : 'Add New Invoice'}</span>
                                    </button>
                                ` : ''}

                                ${canSeePayments ? `
                                    <button onclick="switchTab('payments')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'payments' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}">
                                        <span class="flex items-center space-x-3"><i class="fa-solid fa-money-bill-wave w-5"></i><span>Payments</span></span>
                                        ${toConfirmCount > 0 ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold ${activeTab === 'payments' ? 'bg-white text-emerald-700' : 'bg-indigo-500/20 text-indigo-300'}">${toConfirmCount}</span>` : ''}
                                    </button>
                                ` : ''}

                                ${canSeeIncomplete ? `
                                    <button onclick="switchTab('incomplete')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'incomplete' ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/20' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}">
                                        <span class="flex items-center space-x-3"><i class="fa-solid fa-triangle-exclamation w-5"></i><span>Incomplete Invoices</span></span>
                                        ${incompleteCount > 0 ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold ${activeTab === 'incomplete' ? 'bg-white text-rose-700' : 'bg-rose-500/20 text-rose-400'}">${incompleteCount}</span>` : ''}
                                    </button>
                                ` : ''}

                                <button onclick="switchTab('completed')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'completed' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}">

        }

        window.switchTab = function(tab) {
            window.appState.activeTab = tab;
            window.render();
        };

        window.logout = async function() {
            stopListeners();
            try { await signOut(auth); } catch (e) { console.warn('Sign out:', e); }
            ['invoices', 'suppliers', 'users'].forEach(k => localStorage.removeItem('majani_' + k));
            window.appState.currentUser = null;
            window.appState.invoices = [];
            window.appState.users = [];
            window.render();
        };

        // --- TAB CONTENT SWITCHER ---
        function renderTabContent() {
            switch (window.appState.activeTab) {
                case 'dashboard': return renderDashboardTab();
                case 'add': return renderAddInvoiceTab();
                case 'payments': return renderPaymentsTab();
                case 'incomplete': return renderIncompleteTab();
                case 'completed': return renderCompletedTab();
                case 'suppliers': return renderSuppliersTab();
                case 'users': return renderUsersManagementTab();
                default: return '<div class="text-slate-500">Tab not found</div>';
            }
        }

        // 1. DASHBOARD TAB
        function renderDashboardTab() {
            const user = window.appState.currentUser;
            const invoices = window.appState.invoices;

            let filteredInvoices = [];
            let queueTitle = '';
            let queueSubtitle = '';

            if (user.role === 'Main Store') {
                filteredInvoices = invoices.filter(i => i.currentStage === STAGES.STORE);
                queueTitle = "Main Store Action Queue";
                queueSubtitle = "Invoices awaiting initial registration & submission to Procurement";
            } else if (user.role === 'Procurement') {
                filteredInvoices = invoices.filter(i => i.currentStage === STAGES.PROCUREMENT);
                queueTitle = "Procurement Action Queue (Sharon)";
                queueSubtitle = "Invoices awaiting confirmation before forwarding to Billing";
            } else if (user.role === 'Billing') {
                filteredInvoices = invoices.filter(i => i.currentStage === STAGES.BILLING);
                queueTitle = "Billing Action Queue (Lilian)";
                queueSubtitle = "Invoices awaiting billing and submission to Filing";
            } else if (user.role === 'Filing') {
                filteredInvoices = invoices.filter(i => i.currentStage === STAGES.FILING);
                queueTitle = "Filing Action Queue (Vivian)";
                queueSubtitle = "Invoices awaiting final confirmation, receipt and completion";
            } else if (user.role === 'Admin') {
                filteredInvoices = invoices.filter(i => i.currentStage !== STAGES.COMPLETED);
                queueTitle = "Active System Workflows (Admin View)";
                queueSubtitle = "All in-progress invoices across all departments";
            }

            // oldest-waiting first
            filteredInvoices.sort((a, b) => (daysAtStage(b) ?? -1) - (daysAtStage(a) ?? -1));
            const dashSuppliers = [...new Set(filteredInvoices.map(i => i.supplierName))].sort((a, b) => String(a).localeCompare(String(b)));
            const f = window.appState.dashFilter;

            const totalActive = invoices.filter(i => i.currentStage !== STAGES.COMPLETED).length;
            const totalCompleted = invoices.filter(i => i.currentStage === STAGES.COMPLETED).length;

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl font-bold">
                                <i class="fa-solid fa-file-waveform"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-bold text-slate-900">${totalActive}</div>
                                <div class="text-xs text-slate-500 font-medium">In-Progress Invoices</div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-bold text-slate-900">${totalCompleted}</div>
                                <div class="text-xs text-slate-500 font-medium">Completed & Filed</div>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl font-bold">
                                <i class="fa-solid fa-user-shield"></i>
                            </div>
                            <div>
                                <div class="text-sm font-bold text-slate-900 truncate">${user.username}</div>
                                <div class="text-xs text-emerald-600 font-medium">${user.role}</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div>
                                <h3 class="font-bold text-slate-900 text-base">${queueTitle}</h3>
                                <p class="text-xs text-slate-500 mt-0.5">${queueSubtitle}</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="openExportDialog('all')" class="inline-flex items-center justify-center space-x-2 bg-white hover:bg-slate-50 text-slate-700 text-sm font-semibold px-4 py-2.5 rounded-xl border border-slate-300 transition" title="Download every invoice (all stages) as a CSV file for Excel">
                                    <i class="fa-solid fa-file-export"></i><span>Export All</span>
                                </button>
                                ${(user.role === 'Main Store' || user.role === 'Billing') ? `
                                    <button onclick="switchTab('add')" class="inline-flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-md transition">
                                        <i class="fa-solid fa-plus"></i><span>${user.role === 'Billing' ? 'New Direct Invoice' : 'New Invoice'}</span>
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        ${filteredInvoices.length > 0 ? `
                            <div class="px-6 py-4 border-b border-slate-100 flex flex-col md:flex-row md:items-center gap-3">
                                <input id="dash-q" type="search" value="${escapeHtml(f.q)}" oninput="setDashFilter()" placeholder="Search invoice number, supplier or description" class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                <select id="dash-supplier" onchange="setDashFilter()" class="px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium">
                                    <option value="">All suppliers</option>
                                    ${dashSuppliers.map(n => `<option value="${escapeHtml(n)}" ${n === f.supplier ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}
                                </select>
                                ${user.role === 'Admin' ? `
                                    <select id="dash-stage" onchange="setDashFilter()" class="px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium">
                                        <option value="">All stages</option>
                                        ${Object.values(STAGES).filter(st => st !== STAGES.COMPLETED).map(st => `<option value="${escapeHtml(st)}" ${st === f.stage ? 'selected' : ''}>${escapeHtml(st)}</option>`).join('')}
                                    </select>` : ''}
                                ${kindOptions(filteredInvoices).length > 1 || filteredInvoices.some(i => i.type === 'direct') ? `
                                    <select id="dash-kind" onchange="setDashFilter()" class="px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium">
                                        <option value="">All types</option>
                                        ${kindOptions(filteredInvoices).map(o => `<option value="${escapeHtml(o.value)}" ${o.value === f.kind ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}
                                    </select>` : ''}
                                <span id="dash-count" class="text-xs font-semibold text-slate-500 whitespace-nowrap"></span>
                            </div>
                        ` : ''}

                        ${filteredInvoices.length === 0 ? `
                            <div class="p-12 text-center">
                                <div class="w-16 h-16 rounded-full bg-slate-50 text-slate-400 flex items-center justify-center text-2xl mx-auto mb-3">
                                    <i class="fa-solid fa-folder-open"></i>
                                </div>
                                <h4 class="font-bold text-slate-700 text-sm">No Invoices in Queue</h4>
                                <p class="text-slate-400 text-xs mt-1">Everything is up to date at this stage.</p>
                            </div>
                        ` : `
                            <div class="overflow-x-auto">
                                <table id="dash-table" class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-50/70 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider font-semibold">
                                            <th class="p-4">Invoice #</th>
                                            <th class="p-4">Supplier</th>
                                            <th class="p-4">Amount / Desc</th>
                                            <th class="p-4">Current Stage</th>
                                            <th class="p-4">History & Timestamps</th>
                                            <th class="p-4 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-sm">
                                        ${filteredInvoices.map(inv => `
                                            <tr class="hover:bg-slate-50/50 transition" data-search="${escapeHtml((inv.invoiceNumber + ' ' + inv.supplierName + ' ' + (inv.description || '') + ' ' + (inv.category || '')).toLowerCase())}" data-supplier="${escapeHtml(inv.supplierName)}" data-stage="${escapeHtml(inv.currentStage)}" data-kind="${escapeHtml(kindOf(inv))}">
                                                <td class="p-4 font-bold text-slate-800">${escapeHtml(inv.invoiceNumber)}${typeTag(inv)}</td>
                                                <td class="p-4 font-medium text-slate-700">${escapeHtml(inv.supplierName)}</td>
                                                <td class="p-4">
                                                    <div class="font-semibold text-slate-800">${escapeHtml(inv.amount || 'N/A')}</div>
                                                    <div class="text-xs text-slate-400 truncate max-w-xs">${escapeHtml(inv.description || 'No description')}</div>
                                                    ${inv.returnNote ? `<div class="text-xs text-rose-600 font-semibold mt-1">Returned: ${escapeHtml(inv.returnNote)}</div>` : ''}
                                                </td>
                                                <td class="p-4">
                                                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${getStageBadgeClass(inv.currentStage)}">
                                                        ${inv.currentStage}

                                                    ${payBadge(inv)}${ageBadge(inv)}

                                                <td class="p-4">
                                                    <div class="space-y-1">
                                                        ${inv.history.map(h => `
                                                            <div class="text-[11px] text-slate-500 flex items-center space-x-1">
                                                                <i class="fa-solid fa-check text-emerald-600 text-[10px]"></i>
                                                                <span class="font-semibold text-slate-700">${escapeHtml(h.user)}</span>: <span>${escapeHtml(h.action)}</span>
                                                                <span class="text-slate-400">(${escapeHtml(h.timestamp)})</span>

                                                        `).join('')}
                                                    </div>
                                                </td>
                                                <td class="p-4 text-right space-x-2">
                                                    ${getRoleActionButtons(inv)}
                                                </td>
                                            </tr>

                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function getStageBadgeClass(stage) {
            switch(stage) {
                case STAGES.STORE: return 'bg-amber-100 text-amber-800 border border-amber-200';
                case STAGES.PROCUREMENT: return 'bg-blue-100 text-blue-800 border border-blue-200';
                case STAGES.BILLING: return 'bg-purple-100 text-purple-800 border border-purple-200';
                case STAGES.FILING: return 'bg-indigo-100 text-indigo-800 border border-indigo-200';
                case STAGES.COMPLETED: return 'bg-emerald-100 text-emerald-800 border border-emerald-200';
                case STAGES.INCOMPLETE: return 'bg-rose-100 text-rose-800 border border-rose-200';
                default: return 'bg-slate-100 text-slate-800';
            }
        }

        function getRoleActionButtons(inv) {
            const user = window.appState.currentUser;
            let buttons = '';

            const canAction = (
                (user.role === 'Main Store' && inv.currentStage === STAGES.STORE) ||
                (user.role === 'Procurement' && inv.currentStage === STAGES.PROCUREMENT) ||
                (user.role === 'Billing' && inv.currentStage === STAGES.BILLING) ||
                ((user.role === 'Main Store' || user.role === 'Procurement') && inv.currentStage === STAGES.INCOMPLETE) ||
                (user.role === 'Admin' && inv.currentStage !== STAGES.FILING && inv.currentStage !== STAGES.COMPLETED)
            );

            if (canAction) {
                buttons += `
                    <button onclick="forwardInvoice('${inv.id}')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-sm transition inline-flex items-center space-x-1.5">
                        <span>Submit</span><i class="fa-solid fa-arrow-right"></i>
                    </button>
                `;
            }

            if (canHandlePayments() && inv.currentStage === STAGES.FILING) {
                if (inv.filingStatus !== 'confirmed') {
                    buttons += `
                        <button onclick="confirmFilingReceipt('${inv.id}')" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm transition inline-flex items-center space-x-1.5">
                            <i class="fa-solid fa-inbox"></i><span>Confirm Received</span>
                        </button>`;
                } else {
                    buttons += `
                        <button onclick="openPaymentModal('${inv.id}')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-sm transition inline-flex items-center space-x-1.5">
                            <i class="fa-solid fa-money-bill-wave"></i><span>Record Payment</span>
                        </button>`;
                }
                if ((inv.payments || []).length > 0) {
                    buttons += `
                        <button onclick="openPaymentsHistory('${inv.id}')" class="px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 text-xs font-semibold shadow-sm transition">Payments</button>`;
                }
            }

            const canEdit = (user.role === 'Admin' && inv.currentStage !== STAGES.COMPLETED) ||
                (user.role === 'Billing' && inv.type === 'direct' && inv.currentStage === STAGES.BILLING) ||
                (user.role === 'Main Store' && (inv.currentStage === STAGES.STORE || inv.currentStage === STAGES.INCOMPLETE));
            if (canEdit) {
                buttons += `
                    <button onclick="editInvoice('${inv.id}')" class="px-3 py-1.5 rounded-xl bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 text-xs font-semibold shadow-sm transition inline-flex items-center space-x-1.5" title="Correct the invoice details">
                        <i class="fa-solid fa-pen"></i><span>Edit</span>
                    </button>
                `;
            }

            if ((user.role === 'Main Store' || user.role === 'Admin') && inv.currentStage === STAGES.STORE) {
                buttons += `
                    <button onclick="markInvoiceIncomplete('${inv.id}')" class="px-3 py-1.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold shadow-sm transition inline-flex items-center space-x-1.5" title="Move to the Incomplete Invoices section">
                        <i class="fa-solid fa-triangle-exclamation"></i><span>Mark Incomplete</span>
                    </button>
                `;
            }

            const canReturnBtn = (user.role === 'Admin' && inv.currentStage !== STAGES.STORE) ||
                (user.role === 'Procurement' && inv.currentStage === STAGES.PROCUREMENT) ||
                (user.role === 'Billing' && inv.currentStage === STAGES.BILLING) ||
                (user.role === 'Filing' && inv.currentStage === STAGES.FILING);
            const hideReturn = inv.type === 'direct' && inv.currentStage === STAGES.BILLING;
            if (canReturnBtn && !hideReturn) {
                buttons += `
                    <button onclick="returnInvoice('${inv.id}')" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold shadow-sm transition inline-flex items-center space-x-1.5" title="Return to previous stage">
                        <i class="fa-solid fa-arrow-rotate-left"></i><span>Return</span>
                    </button>
                `;
            }

            return buttons;
        }

        // --- WORKFLOW ACTIONS ---
        window.forwardInvoice = function(id) {
            const user = window.appState.currentUser;
            const invoices = window.appState.invoices;
            const inv = invoices.find(i => i.id === id);
            if (!inv) return;
            if (inv.currentStage === STAGES.FILING || inv.currentStage === STAGES.COMPLETED) {
                window.showToast('Invoices at Filing are completed by confirming receipt and recording payments (Payments tab).', 'warning');
                return;
            }

            let nextStage = '';
            let actionName = '';

            if (inv.currentStage === STAGES.INCOMPLETE) {
                if (user.role === 'Procurement') {
                    nextStage = STAGES.BILLING;
                    actionName = 'Confirmed (was Incomplete) & Submitted to Billing';
                } else {
                    nextStage = STAGES.PROCUREMENT;
                    actionName = user.role === 'Admin' ? 'Advanced by Admin (was Incomplete)' : 'Completed & Submitted to Procurement';
                }
            } else if (inv.currentStage === STAGES.STORE) {
                nextStage = STAGES.PROCUREMENT;
                actionName = 'Submitted to Procurement';
            } else if (inv.currentStage === STAGES.PROCUREMENT) {
                nextStage = STAGES.BILLING;
                actionName = 'Confirmed & Submitted to Billing';
            } else if (inv.currentStage === STAGES.BILLING) {
                nextStage = STAGES.FILING;
                actionName = 'Billed & Submitted to Filing';
            } else if (inv.currentStage === STAGES.FILING) {
                nextStage = STAGES.COMPLETED;
                actionName = 'Received & Completed';
            } else if (user.role === 'Admin') {
                if (inv.currentStage === STAGES.STORE) nextStage = STAGES.PROCUREMENT;
                else if (inv.currentStage === STAGES.PROCUREMENT) nextStage = STAGES.BILLING;
                else if (inv.currentStage === STAGES.BILLING) nextStage = STAGES.FILING;
                else if (inv.currentStage === STAGES.FILING) nextStage = STAGES.COMPLETED;
                actionName = 'Advanced by Admin';
            }

            window.showConfirmationModal(
                'Confirm Invoice Submission',
                `Are you sure you want to submit invoice #${escapeHtml(inv.invoiceNumber)} to ${nextStage}?`,
                async () => {
                    inv.currentStage = nextStage;
                    inv.stageSince = new Date().toISOString();
                    inv.returnNote = '';
                    if (nextStage === STAGES.FILING) inv.filingStatus = '';
                    inv.history.push({
                        stage: nextStage === STAGES.COMPLETED ? STAGES.FILING : nextStage,
                        user: user.username,
                        timestamp: getCurrentTimestamp(),
                        action: actionName
                    });

                    await window.saveInvoiceToCloud(inv);
                    window.showToast(`Invoice #${escapeHtml(inv.invoiceNumber)} submitted successfully!`);
                    window.render();
                }
            );
        };

        window.returnInvoice = function(id) {
            const user = window.appState.currentUser;
            const inv = window.appState.invoices.find(i => i.id === id);
            if (!inv) return;

            const canReturn = user.role === 'Admin' ||
                (user.role === 'Procurement' && inv.currentStage === STAGES.PROCUREMENT) ||
                (user.role === 'Billing' && inv.currentStage === STAGES.BILLING) ||
                (user.role === 'Filing' && inv.currentStage === STAGES.FILING);
            if (!canReturn) {
                window.showToast('You cannot return this invoice.', 'error');
                return;
            }

            let prevStage = '';
            if (inv.currentStage === STAGES.INCOMPLETE) prevStage = STAGES.STORE;
            else if (inv.currentStage === STAGES.PROCUREMENT) prevStage = STAGES.STORE;
            else if (inv.currentStage === STAGES.BILLING) prevStage = STAGES.PROCUREMENT;
            else if (inv.currentStage === STAGES.FILING) prevStage = STAGES.BILLING;
            else if (inv.currentStage === STAGES.COMPLETED) prevStage = STAGES.FILING;
            if (!prevStage) return;
            if (inv.type === 'direct' && (prevStage === STAGES.PROCUREMENT || prevStage === STAGES.STORE)) {
                window.showToast('Direct invoices start at Billing, so there is no earlier step to return to.', 'warning');
                return;
            }

            if ((inv.currentStage === STAGES.FILING || inv.currentStage === STAGES.COMPLETED) && activePayments(inv).length > 0) {
                window.showToast('This invoice has payments recorded. Reverse them first (Payments button), then return it.', 'warning');
                return;
            }
            const reason = prompt(`Why are you returning invoice #${inv.invoiceNumber} to ${prevStage}? (required)`, '');
            if (reason === null) return;
            if (!reason.trim()) { window.showToast('A reason is required to return an invoice.', 'warning'); return; }

            window.showConfirmationModal(
                'Return Invoice to Previous Step',
                `Return invoice #${escapeHtml(inv.invoiceNumber)} to <b>${escapeHtml(prevStage)}</b>?<br><span class="text-xs text-slate-500">Reason: ${escapeHtml(reason.trim())}</span>`,
                async () => {
                    inv.currentStage = prevStage;
                    inv.stageSince = new Date().toISOString();
                    inv.returnNote = reason.trim();
                    inv.filingStatus = '';
                    inv.paidAt = '';
                    inv.history.push({
                        stage: prevStage,
                        user: user.username,
                        timestamp: getCurrentTimestamp(),
                        action: `Returned to ${prevStage}: ${reason.trim()}`
                    });
                    await window.saveInvoiceToCloud(inv);
                    window.showToast(`Invoice #${escapeHtml(inv.invoiceNumber)} returned to ${escapeHtml(prevStage)}.`, 'warning');
                    window.render();
                },
                'Return Invoice',
                true
            );
        };

        // EVENT BINDINGS
        function bindMainLayoutEvents() {
            const user = window.appState.currentUser;
            const activeTab = window.appState.activeTab;

            if (activeTab === 'add' && (user.role === 'Main Store' || user.role === 'Admin' || user.role === 'Billing')) {
                const supplierInput = document.getElementById('inv-supplier');
                const suggestionsBox = document.getElementById('supplier-suggestions');

                supplierInput.oninput = (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    const suppliers = window.appState.suppliers;
                    if (!query) {
                        suggestionsBox.classList.add('hidden');
                        return;
                    }

                    const matches = suppliers.filter(s => s.toLowerCase().includes(query));
                    if (matches.length > 0) {
                        suggestionsBox.innerHTML = matches.map(m => `
                            <div class="px-4 py-2.5 hover:bg-emerald-50 cursor-pointer text-sm font-medium text-slate-700 border-b border-slate-100 last:border-0" data-name="${escapeHtml(m)}" onclick="selectSupplier(this.dataset.name)">
                                ${escapeHtml(m)}
                            </div>
                        `).join('');
                        suggestionsBox.classList.remove('hidden');
                    } else {
                        suggestionsBox.innerHTML = `
                            <div class="px-4 py-3 text-xs text-emerald-600 font-semibold bg-emerald-50">
                                <i class="fa-solid fa-circle-plus mr-1.5"></i>New supplier will be added to database upon submission.
                            </div>
                        `;
                        suggestionsBox.classList.remove('hidden');
                    }
                };

                // Live duplicate warning while typing
                const dupBox = document.getElementById('dup-warning');
                const checkDup = () => {
                    const d = window.findDuplicateInvoices(
                        document.getElementById('inv-number').value,
                        supplierInput.value,
                        document.getElementById('inv-amount').value
                    );
                    if (d.exact.length) {
                        dupBox.className = 'p-4 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800';
                        dupBox.innerHTML = '<b>Duplicate warning:</b> this invoice number, supplier and amount already exist.<ul class="list-disc pl-5 mt-1 space-y-1">' + d.exact.map(describeInvoice).join('') + '</ul>';
                    } else if (d.partial.length) {
                        dupBox.className = 'p-4 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-800';
                        dupBox.innerHTML = '<b>Heads up:</b> same invoice number and supplier already exist with a different amount.<ul class="list-disc pl-5 mt-1 space-y-1">' + d.partial.map(describeInvoice).join('') + '</ul>';
                    } else {
                        dupBox.className = 'hidden';
                        dupBox.innerHTML = '';
                    }
                };
                ['inv-number', 'inv-supplier', 'inv-amount'].forEach(id => document.getElementById(id).addEventListener('input', checkDup));

                document.getElementById('add-invoice-form').onsubmit = (e) => {
                    e.preventDefault();
                    const invoiceNumber = document.getElementById('inv-number').value.trim();
                    const dateReceived = document.getElementById('inv-date').value;
                    const supplierName = supplierInput.value.trim();
                    const amountNum = parseFloat(document.getElementById('inv-amount').value);
                    const currency = document.getElementById('inv-currency').value;
                    const amount = isNaN(amountNum) ? '' : formatMoney(amountNum, currency);
                    const description = document.getElementById('inv-desc').value.trim();
                    const asIncomplete = !!(e.submitter && e.submitter.dataset && e.submitter.dataset.mode === 'incomplete');
                    const incompleteNoteEl = document.getElementById('inv-incomplete-note');
                    const incompleteNote = incompleteNoteEl ? incompleteNoteEl.value.trim() : '';
                    const isDirect = user.role === 'Billing';
                    const category = isDirect ? document.getElementById('inv-category').value.trim() : '';

                    if (!invoiceNumber || !supplierName) {
                        window.showToast('Please fill in Invoice Number and Supplier Name.', 'error');
                        return;
                    }
                    if (isDirect && !category) {
                        window.showToast('Please choose or type a category.', 'error');
                        return;
                    }

                    const dups = window.findDuplicateInvoices(invoiceNumber, supplierName, amount);
                    const hasExact = dups.exact.length > 0;
                    const hasPartial = !hasExact && dups.partial.length > 0;
                    let modalTitle = asIncomplete ? 'Save Incomplete Invoice' : 'Confirm New Invoice';
                    let modalMsg = asIncomplete
                        ? `Save invoice #${escapeHtml(invoiceNumber)} from "${escapeHtml(supplierName)}" as <b>incomplete</b>? It will go to the Incomplete Invoices section, where Alimah and Sharon can submit it later.`
                        : (isDirect ? `Add direct invoice #${escapeHtml(invoiceNumber)} from "${escapeHtml(supplierName)}" (${escapeHtml(category)}) and submit it straight to <b>Filing (Vivian)</b>? It will not pass through Main Store or Procurement.` : `Add invoice #${escapeHtml(invoiceNumber)} from "${escapeHtml(supplierName)}" and submit to Procurement?`);
                    if (hasExact) {
                        modalTitle = 'Duplicate Invoice Detected';
                        modalMsg = `<span class="font-semibold text-rose-600">An invoice with the same invoice number, supplier and amount is already in the system:</span><ul class="list-disc pl-5 mt-2 mb-2 text-xs text-slate-700 space-y-1">${dups.exact.map(describeInvoice).join('')}</ul>Submitting it again could cause a double payment. Only continue if you have confirmed this is a different invoice.`;
                    } else if (hasPartial) {
                        modalTitle = 'Possible Duplicate Invoice';
                        modalMsg = `<span class="font-semibold text-amber-600">An invoice with the same number and supplier already exists, but with a different amount:</span><ul class="list-disc pl-5 mt-2 mb-2 text-xs text-slate-700 space-y-1">${dups.partial.map(describeInvoice).join('')}</ul>You entered ${escapeHtml(amount || 'no amount')}. Please check before continuing.`;
                    }

                    window.showConfirmationModal(
                        modalTitle,
                        modalMsg,
                        async () => {
                            // Auto save supplier if new
                            let suppliers = window.appState.suppliers;
                            if (!suppliers.some(s => s.toLowerCase() === supplierName.toLowerCase())) {
                                await window.saveSupplierToCloud(supplierName);
                            }

                            const newInvoice = {
                                id: 'INV-' + Date.now(),
                                invoiceNumber,
                                supplierName,
                                amount,
                                amountValue: isNaN(amountNum) ? null : amountNum,
                                currency: currency,
                                description,
                                type: isDirect ? 'direct' : 'standard',
                                category: category,
                                filingStatus: '',
                                currentStage: isDirect ? STAGES.FILING : (asIncomplete ? STAGES.INCOMPLETE : STAGES.PROCUREMENT),
                                stageSince: new Date().toISOString(),
                                incompleteNote: asIncomplete ? incompleteNote : '',
                                history: [
                                    {
                                        stage: isDirect ? STAGES.BILLING : STAGES.STORE,
                                        user: user.username,
                                        timestamp: `${dateReceived} (${getCurrentTimestamp()})`,
                                        action: isDirect ? `Created directly at Billing (${category}) & submitted to Filing` : asIncomplete
                                            ? 'Added & Marked Incomplete' + (incompleteNote ? ': ' + incompleteNote : '')
                                            : 'Added & Submitted to Procurement'
                                    }
                                ]
                            };

                            await window.saveInvoiceToCloud(newInvoice);
                            window.showToast(asIncomplete ? 'Invoice saved as incomplete.' : (isDirect ? 'Direct invoice added & submitted to Filing!' : 'Invoice added & submitted to Procurement!'), asIncomplete ? 'warning' : 'success');
                            window.appState.activeTab = asIncomplete ? 'incomplete' : 'dashboard';
                            window.render();
                        },
                        (hasExact || hasPartial) ? 'Submit Anyway' : 'Confirm & Proceed',
                        hasExact
                    );
                };
            }

            if (activeTab === 'users') {
                const passForm = document.getElementById('change-own-pass-form');
                if (passForm) {
                    passForm.onsubmit = async (e) => {
                        e.preventDefault();
                        const p1 = document.getElementById('my-new-pass').value;
                        const p2 = document.getElementById('my-confirm-pass').value;
                        if (p1.length < 8) { window.showToast('Use at least 8 characters.', 'error'); return; }
                        if (p1 !== p2) { window.showToast('Passwords do not match.', 'error'); return; }
                        try {
                            await updatePassword(auth.currentUser, p1);
                            window.showToast('Password updated successfully!');
                            passForm.reset();
                        } catch (err) {
                            const msg = err && err.code === 'auth/requires-recent-login'
                                ? 'For security, sign out and sign in again, then change your password.'
                                : 'Could not update password (' + ((err && err.code) || 'error') + ').';
                            window.showToast(msg, 'error');
                        }
                    };
                }
                const addForm = document.getElementById('add-user-form');
                if (addForm) {
                    addForm.onsubmit = async (e) => {
                        e.preventDefault();
                        const ok = await window.adminCreateUser({
                            name: document.getElementById('new-user-name').value.trim(),
                            email: document.getElementById('new-user-email').value.trim(),
                            role: document.getElementById('new-user-role').value,
                            pass: document.getElementById('new-user-pass').value
                        });
                        if (ok) { window.showToast('User created.'); addForm.reset(); }
                    };
                }
            }
        }

        window.selectSupplier = function(name) {
            document.getElementById('inv-supplier').value = name;
            document.getElementById('supplier-suggestions').classList.add('hidden');

        window.addNewSupplierManually = async function() {

            let suppliers = window.appState.suppliers;
            if (suppliers.includes(name)) {

        window.adminCreateUser = async function({ name, email, role, pass }) {
            // A second, temporary Firebase app so creating the account does not sign the Admin out
            const secondary = initializeApp(firebaseConfig, 'secondary-' + Date.now());
            try {
                const sAuth = getAuth(secondary);
                const cred = await createUserWithEmailAndPassword(sAuth, email, pass);
                await setDoc(doc(db, ...dataPath, 'users', cred.user.uid), {
                    uid: cred.user.uid, username: name, email: email, role: role, avatar: ROLE_AVATARS[role] || ''
                });
                await signOut(sAuth);
                return true;
            } catch (err) {
                const code = (err && err.code) || '';
                const msg = code === 'auth/email-already-in-use' ? 'That email already has an account.'
                    : code === 'auth/weak-password' ? 'Password is too weak (use 8+ characters).'
                    : code === 'auth/operation-not-allowed' ? 'Enable Email/Password sign-in in Firebase Authentication first.'
                    : code === 'permission-denied' ? 'Not allowed. Check the Firestore rules.'
                    : 'Could not create user (' + (code || 'error') + ').';
                window.showToast(msg, 'error');
                return false;
            } finally {
                try { await deleteApp(secondary); } catch (e) {}
            }
        };

        window.deleteLegacyUsers = async function() {
            try {
                const snap = await getDocs(collection(db, ...dataPath, 'users'));
                let n = 0;
                for (const d of snap.docs) {
                    if (!d.data().uid) { await deleteDoc(d.ref); n++; }
                }
                window.showToast(`Deleted ${n} old record${n === 1 ? '' : 's'}.`);
